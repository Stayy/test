scan_feature_matcher:
  ros__parameters:
    scan_topic: /scan
    base_frame: base_link
    odom_frame: odom
    publish_tf: true

    # Laser mounting pose relative to base_link.
    # Measure these values after installing the lidar on the chassis.
    laser_x: 0.0
    laser_y: 0.0
    laser_yaw: 0.0

    # Feature extraction.
    corner_window: 4
    corner_threshold: 0.28
    range_jump_threshold: 0.35
    min_feature_separation: 5
    max_features: 80

    # Feature correspondence and robust transform estimation.
    max_correspondence_distance: 0.9
    max_bearing_shift: 0.65
    max_descriptor_distance: 2.5
    descriptor_weight: 0.35
    bearing_weight: 0.15
    min_matches: 3
    ransac_inlier_threshold: 0.18
    max_ransac_trials: 160

    # Reject impossible per-scan chassis motion.
    max_motion_translation: 1.2
    max_motion_rotation: 0.8

    # Custom landmark: a fence made from 5 small poles spaced by 10 cm.
    custom_pattern_enabled: true
    pole_cluster_jump_threshold: 0.06
    pole_min_points: 1
    pole_max_points: 12
    pole_min_width: 0.0
    pole_max_width: 0.08
    pole_max_range: 6.0
    fence_pole_count: 5
    fence_spacing: 0.10
    fence_spacing_tolerance: 0.03
    fence_collinearity_tolerance: 0.025
    fence_max_pattern_error: 0.035
    fence_max_candidate_poles: 30
    fence_max_detections: 3
