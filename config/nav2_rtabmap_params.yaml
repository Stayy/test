# Nav2 navigation parameters
# RTAB-Map provides localization; Nav2 handles planning, smoothing, control, and recovery.
# The command velocity limits are tuned for a chassis with a practical top speed near 0.35 m/s.

# ===== Map server: load a pre-saved PGM+YAML map =====
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # Pass from launch, for example map:=/path/to/map.yaml

# ===== Global planner: generate an optimal path from start to goal =====
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ===== Path smoother: reduce jagged turns from grid-based Navfn paths =====
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      do_refinement: true

# ===== Local controller: track the global path and avoid dynamic obstacles =====
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      # 0.52 rad is about 30 degrees. Use 3.14 only if the final yaw is intentionally ignored.
      yaw_goal_tolerance: 0.52
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.5
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.0

      # Keep final heading handling inside the controller state once the XY tolerance is reached.
      # This prevents the carrot point from being re-selected on alternating sides of the robot,
      # which can make the robot reverse angular direction before it reaches the target yaw.
      stateful: true
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.35
      max_angular_vel: 0.35
      max_angular_accel: 0.8

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.2
      transform_tolerance: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_cost_regulated_linear_velocity_scaling: true
      use_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.8
      cost_scaling_gain: 1.5
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.10

    plugin_lib_names:
      - nav2_regulated_pure_pursuit_controller

# ===== Behavior-tree navigator: orchestrate navigation tasks =====
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /chassis/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_goal_updater_node_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node

# ===== Behavior server: recovery actions when navigation is stuck =====
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

# ===== Waypoint follower: execute multiple goals in order =====
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

# ===== Lifecycle manager: automatically activate all Nav2 nodes =====
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - planner_server
      - smoother_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
